name: cohere-transcribe-03-2026
kind: model
engine: vllm
contract: openai
api: audio.transcriptions
# Local copy of CohereLabs/cohere-transcribe-03-2026 @d552dad in ${AI_ASSETS}/cohere-transcribe-03-2026.
# TODO(verify): not downloaded yet; the repo is gated (accept the terms on Hugging Face, then HF_TOKEN in .env):
#   hf download CohereLabs/cohere-transcribe-03-2026 --revision d552dadc2922ba6f6c1f994f8db904d52dcaf942
#     --local-dir $AI_ASSETS/cohere-transcribe-03-2026 --exclude 'assets/*' --exclude 'demo/*' --exclude '.eval_results/*'
# CohereAsrForConditionalGeneration (SupportsTranscription) is registered in vLLM v0.31.0 (checked in the image's
# ModelRegistry, 2026-10-23). vLLM's cohere_asr.py reads the NeMo-style config keys (encoder, transf_decoder, head,
# preprocessor, max_audio_clip_s) and chunks long audio at max_audio_clip_s itself.
# TODO(verify): the card serves it with --trust-remote-code; check whether config.json loads without it (the image's
# transformers 5.17 has a native cohere_asr config) before adding it, and read the repo's *.py files if it is needed.
model: /models/cohere-transcribe-03-2026
port: 8108
gpu:
  util: 0.22                       # 7.0 GB: 4.1 GB bf16 weights + ~1.6 GB encoder profiling/non-torch + ~1.3 GB KV (~40k tokens at 32 KB/token)
  # TODO(verify): estimate from transformers' CohereAsrConfig defaults (48-layer 1280-d conformer encoder, 8-layer
  # 1024-d decoder with 8 heads), which add up to the checkpoint's ~2B params; replace with measured memory.
args:
  - --max-model-len=1024           # decoder context; TODO(verify) against transf_decoder.config_dict.max_sequence_length
  - --max-num-seqs=4               # requests are sequential; keeps the profiling batch small
  - '--limit-mm-per-prompt={"audio": 1}'   # one clip per request; bounds encoder memory at profiling
description: "Speech-to-text, Cohere Transcribe 2B conformer encoder-decoder (14 languages: en, fr, de, it, es, pt, el, nl, pl, zh, ja, ko, vi, ar); no language detection, so pass `language` (vLLM defaults to en); punctuated output, no timestamps; put a VAD in front, as it transcribes non-speech"
tasks: [speech-recognition]
