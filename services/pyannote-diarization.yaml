name: pyannote-diarization
kind: model
engine: custom
contract: oip-v2
api: infer
contract_reason: "No OpenAI route for diarization alone; input is a float audio array"
port: 8402
gpu:
  vram_gb: 3                       # two small models (6 MB segmentation, 27 MB embedding) + batch activations
                                   # 2 -> 3 on 2026-10-17: at 2 GB, 20-45 s files hit CUDA OOM in the embedding
                                   # batch (32); peak was ~2.1 GB
description: "Speaker diarization, pyannote speaker-diarization-3.1 (overlap-aware; optional speaker-count hints)"
tasks: [speaker-diarization]
build:
  context: custom/pyannote-diarization
  image: "{registry}/pyannote-diarization:0.1.0"
  base: py-cuda-torch211           # pyannote.audio 4 needs torchaudio, whose last release pairs with torch 2.11
  base_version: "0.1.1"            # moves to the current base in its batching wave
weights:
  path: ${AI_ASSETS}/pyannote-speaker-diarization-3.1   # existing local copy
  mount: /models
custom_reason: >-
  Checked 2026-10-17: a multi-stage pyannote pipeline (segmentation, embeddings, clustering), not an LLM;
  vLLM and SGLang cannot run it. An OIP-native server (Triton/MLServer) would still need the pipeline's
  Python logic. Retire if an OIP engine is added with a pyannote runtime.
signature:
  inputs:
    - {name: AUDIO, datatype: FP32, shape: [-1]}
    - {name: SAMPLE_RATE, datatype: INT32, shape: [1], example: [16000]}
  outputs:
    - {name: SEGMENTS, datatype: FP32, shape: [-1, 2]}
    - {name: SPEAKERS, datatype: INT32, shape: [-1]}
