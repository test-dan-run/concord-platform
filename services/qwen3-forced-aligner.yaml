name: qwen3-forced-aligner
kind: model
engine: custom
contract: oip-v2
api: infer
contract_reason: "No OpenAI route for forced alignment; input is a float audio array plus its transcript"
port: 8407
gpu:
  vram_gb: 4                       # measured 2026-10-19: 2.3 GB loaded, ~3.7 GB peak on a 173 s clip (requests capped at 180 s)
description: "Word-level forced alignment, Qwen3-ForcedAligner 0.6B (80 ms steps, up to 180 s, 10 languages); per-word confidence"
tasks: [forced-alignment, word-timestamps]
build:
  context: custom/qwen3-forced-aligner
  image: "{registry}/qwen3-forced-aligner:0.1.0"
  base: py-cuda-torch211           # one base for the phase C/D services
  base_version: "0.1.1"            # moves to the current base in its batching wave
weights:
  path: ${AI_ASSETS}/custom-models/qwen3-forced-aligner/0.6b-c7cbfc2
  mount: /models
custom_reason: >-
  Checked 2026-10-18: vLLM v0.31.0 registers the aligner only as a token classifier, so callers would have to
  build the timestamp-slot prompt and decode classes themselves; no OpenAI route returns word timings. Retire when
  an engine returns word-level alignment for it behind an OIP route. See custom/qwen3-forced-aligner/WHY.md.
signature:
  inputs:
    - {name: AUDIO, datatype: FP32, shape: [-1]}
    - {name: SAMPLE_RATE, datatype: INT32, shape: [1], example: [16000]}
    - {name: TEXT, datatype: BYTES, shape: [1], example: ["hello there"]}
    - {name: LANGUAGE, datatype: BYTES, shape: [1], example: ["en"]}
  outputs:
    - {name: WORDS, datatype: BYTES, shape: [-1]}
    - {name: TIMES, datatype: FP32, shape: [-1, 2]}
    - {name: SCORES, datatype: FP32, shape: [-1]}
