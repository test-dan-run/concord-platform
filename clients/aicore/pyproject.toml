[project]
name = "aicore"
version = "0.1.0"
description = "Client for the personal AI service platform: resolve a service by name or alias and get the right client for its contract"
requires-python = ">=3.10"
dependencies = [
    "openai>=1.40",
    "httpx>=0.27",
    "pyyaml>=6.0",
]

[project.optional-dependencies]
oip = ["numpy>=1.26"]

[build-system]
requires = ["hatchling>=1.25"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/aicore"]
# The endpoint map is generated by `just render` and gitignored; include it when present.
artifacts = ["src/aicore/endpoints.generated.yaml"]
