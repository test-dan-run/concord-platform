# Global platform settings. Read by tools/schema.py.
gpu_total_gb: 32                  # RTX 5090
util_limit: 0.93                  # max summed VRAM fraction of services running together
assets_dir: ~/ai-assets           # overridden by AI_ASSETS env var (see .env)
ai_host: localhost                # overridden by AI_HOST env var
registry: ghcr.io/owner           # placeholder for custom image pushes (must be lowercase)
network: ai-net
