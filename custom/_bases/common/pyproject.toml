[project]
name = "aisvc"
version = "0.1.0"
description = "App factories for custom platform services: openai, openai-inspired and oip-v2 contracts"
requires-python = ">=3.12"
dependencies = [
    "fastapi>=0.115",
    "uvicorn>=0.30",
    "numpy>=1.26",
    "python-multipart>=0.0.9",  # multipart uploads for /v1/audio/transcriptions
]

[project.optional-dependencies]
audio = ["soundfile>=0.13"]  # mp3/flac/opus encoding for audio.speech (wav/pcm need nothing)

[build-system]
requires = ["hatchling>=1.25"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["aisvc"]
